# Goal is disabled as a service, not only as a model-facing tool.
- id: goal
  disabled: true
- id: goal-round-driver
  disabled: true
- id: command-goal
  disabled: true
- id: ui-goal
  disabled: true

# Suppress restored Goal rounds after the service is disabled.
- insert:
    - id: goal-disabled
      name: ./goal-disabled.cjs