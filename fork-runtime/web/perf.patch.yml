# Fork Web startup-cost overlay. run.cmd applies it last, after the profile's
# own patch, the diagnostics overlay and any memory-limit overlay, so a row
# restated here wins for that launch. `pnpm run dev:web` and other `dsh web`
# launches do not read this file: the development rebuild watcher keeps its
# default bundle polling.
#
# A patch target replaces the row's whole `config`. Every deployment-specific
# value a row needs must therefore be restated here; see FORK_MAINTENANCE.md.

# The launch overlays (this file, the diagnostics overlay and the memory-limit
# overlay) live in the repository checkout or are fixed for one launch, so the
# profile HMR does not watch them. When it did, every merge into the checkout
# that touched this file reconfigured the running Host three seconds later:
# 2026-11-27 17:48 and 19:26, twelve and nine running Sessions ended their
# Turns as `aborted / disposed` with "Error: tool call aborted". An overlay edit
# now applies at the next restart or the next profile patch reload. The row
# restates the base bundle's `root: []`.
- id: hmr
  config:
    root: []
    watchOverlays: false

# Production builds never rewrite client bundles, so the 500 ms stat poll over
# every graph row's bundle only costs file-system work. An hour keeps a manual
# rebuild of a long-running Host detectable without polling a few dozen files
# twenty times a second; graph changes still arrive over /plugins/events.
- id: client-hmr
  config:
    pollIntervalMs: 3600000

# Catalog hints for unopened Sessions. Each key below is read only by a surface
# of the opened Session (chat, composer, context meter), which receives them on
# its follow stream (`projectionChanges`) and through on-demand
# `session.projections` reads; the control stream omits them like the list. Keys the
# list reads stay in the hints and are not excluded: `title`,
# `sessionListMetadata`, `agentPreset`, `subagent`, `subagentCatalog`,
# `subagentTiming`, and `tokenUsage` (subagent header rows of unopened children).
# `contextPressure` and `contextBreakdown` need no entry here: upstream marks
# both summary-excluded at registration, so a Session summary never carries them
# and no list config can add them back. The dsh-context agent graph reads them
# for unopened child Sessions through its own on-demand head request.
#
# `subagentCatalog` itself is bounded where it is pushed: its registration
# declares a `wire.hintView` (newest 32 entries), so a list row, a control
# baseline and a follow opening carry only that suffix while
# `session.projections` keeps the complete catalog. Do not exclude it here: the
# sidebar's running-subagent count and the Context agent graph read it from
# list rows, and the opened Session's panel reads it on demand.
#
# `historyPageMaxBytes` bounds each history page (Session open, live opening,
# and Load earlier) to about 2 MiB of serialized records, trimmed at message
# boundaries with the newest message always kept. Unbounded first frames of
# 40-80 MB took 10-17 s to parse and render in the browser and block remote
# use on slower links.
#
# `historyWindowFirstEvents` starts a stored window read at 1,024 events. At the
# default 256, every measured opening of a Session over 2 MiB (2.8 to 731 MB
# logs, whose Turns run hundreds of tool calls) found no Turn boundary and read
# the same tail again at 1,024: SimCore spent 692 ms + 540 ms in the two reads.
- id: session-controller
  config:
    historyPageMaxBytes: 2097152
    historyWindowFirstEvents: 1024
    listProjectionExcludeKeys:
      - contextHeaders
      - turnOutline
      - sessionStats
      - todos
      - userQuestions
      - plan
      - goal
      - permissions
      - modelSelection
      - imageLimits

# Compress every Remote stream frame. `permessage-deflate` keeps its window
# across frames, so a ~290-byte Assistant chunk frame costs a few bytes on the
# wire instead of going out raw below the 1 KiB default: one 4,000-character
# streamed reply measured 320 KB on the wire at the default and about 17 KB
# here, which matters on a relay link.
#
# Ping every 15 s instead of every 2 s. The Host ends a connection after two
# unanswered Pings, and a browser answers a Ping only after it has received
# every byte queued before it. Behind the relay, frpc takes the Host's bytes at
# local speed, so a large frame still crossing a slow phone link leaves no
# write progress for the Host to see: at 2 s, an 8 s link stall or a 2.7 MB
# opening snapshot on a 5 Mbit/s link ended the connection, and the reconnect
# sent the same snapshot again. At 15 s the same stall kept the connection;
# a dead peer is detected within 45 s.
- id: typert-gateway
  config:
    websocketCompressionThreshold: 0
    websocketHeartbeatIntervalMs: 15000

# The retention pass reads and validates every stored checkpoint record (about
# 39,000 records and 640 MB on the measured home) to rank them, which took about
# 48 s at a fifth of the main thread. Upstream starts it 10 s after startup, in
# the window where the Session list loads and the first Sessions open; five
# minutes keeps it out of that window. The other two values restate the base
# bundle row, because this target replaces the row's whole config.
- id: session-projection-cache
  config:
    writeEveryEvents: 200
    writeIntervalMs: 5000
    compactionStartDelayMs: 300000