- insert:
    - id: fork-memory-recorder
      name: './index.mjs'
      config:
        intervalMs: 30000
        # Continuous allocation sampling and automatic heap snapshots slow the
        # Host. Both stay off unless the launcher environment opts in with
        # DSH_MEMORY_RECORDER_SAMPLING=1 or DSH_MEMORY_RECORDER_SNAPSHOTS=1.
        sampling: !!js process.env.DSH_MEMORY_RECORDER_SAMPLING === '1'
        snapshots: !!js process.env.DSH_MEMORY_RECORDER_SNAPSHOTS === '1'
        profileIntervalMs: 120000
        samplingIntervalBytes: 1048576
        maxTracked: 10000
        maxDetails: 64
        minDisposedAgeMs: 60000
        logFileMiB: 16
        logFiles: 4
        profileFileMiB: 32
        profileFiles: 4
        snapshotDelayMs: 30000
        snapshotGrowthMiB: 768
        snapshotMaxHeapMiB: 1536
        snapshotMaxHeapTotalMiB: 2048
        reserveMiB: 2048
        reserveHeapMultiplier: 4
        captureBudgetMiB: 8192
