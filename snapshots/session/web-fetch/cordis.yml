# The web-fetch scenario keeps HTTP and rendering real, replaces the external
# page with a local fixture, and omits unrelated platform-specific shell tools.
- insert:
    - id: web-fetch-fixture
      name: './web-fetch-fixture-server.mjs'

- id: web
  name: '@deepseek-ai/dsh-web'

- id: web-fetch-http
  name: '@deepseek-ai/dsh-web-fetch-http'
  disabled: true

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    search: false

- id: tool-bash
  disabled: true

- id: tool-pwsh
  disabled: true

- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'
  config:
    personaPrefix: |
      You are a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}.

      Verify your work by running the code or tests. Keep answers brief and factual.
