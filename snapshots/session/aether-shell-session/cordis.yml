# Composition owner for the AetherShell persistent-session scenario. The scenario
# is authored, so this live twin is never recorded; it exists so the composition
# has exactly one owner and so the replay patch's plugin wiring has a reviewable
# counterpart. The owner is the live pin that the retired lifecycle scenario
# shares, so every tool-schema and prompt sidecar pinned here also describes that
# historical replay.
#
# The interpreter fixture stays beside the retired lifecycle recording; both
# scenarios derive its sibling path from the harness's own absolute fixture path,
# so neither owns a second copy of the stand-in binary.
- insert:
    - id: aether-shell
      name: '../../../fork-plugins/dsh-plugin-aether-shell/src/index.ts'
      config:
        executable: !!js process.execPath
        executableArgs:
          # The fixture sits in the retired scenario's directory; this path is
          # resolved from whichever scenario's Session fixture is replaying.
          - !!js 'process.env.DSH_SNAPSHOT_FILE.replace(/[^\\/]+$/, "../aether-shell-lifecycle/aether-lifecycle-fixture.mjs")'
          # Trusted control root: the run's isolated DSH home plus the directory
          # the observing jobs provider publishes wait registrations into.
          - !!js 'process.env.DSH_HOME + "/aether-fixture-wait"'
        # This composition also replays the retired lifecycle recording, which
        # predates foreground-to-job promotion. Keeping it off is the
        # compatibility opt-out that lets that committed session stay exactly as
        # recorded, without query job lifecycle events it never contained.
        promoteOnTimeout: false

    - id: jobs-wait-observer
      name: '../aether-shell-lifecycle/jobs-wait-observer.mjs'
      config:
        terminalJobRetentionMs: 3600000
        maxRetainedTerminalJobsPerOwner: 100

# The shipped local provider is disabled in favor of the observing subclass
# above: the subclass registers the same `jobs` service and keeps every registry
# semantic, so only one provider is ever present.
- id: jobs
  disabled: true

# The recorded scenarios exercise the native AetherShell tools only. Both shipped
# shell tools are disabled so the pinned header and prompt do not depend on the
# host's shell dialect (tool-pwsh on Windows, tool-bash elsewhere).
- id: tool-bash
  disabled: true

- id: tool-pwsh
  disabled: true
