# Keyless counterpart to background-job-wait-wake.cordis.yml: keep the fixed
# job producer and replace only the external model adapter.
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  disabled: true

- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro
    - id: snapshot-idle-job
      name: '../../../packages/test-support/session-snapshot/tests/fixtures/idle-job.ts'
