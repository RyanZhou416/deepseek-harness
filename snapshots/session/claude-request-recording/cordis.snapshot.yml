# Replay patch shared by the ordinary headless snapshot composition. The model
# script comes from the scenario's committed session JSONL. This recording-only scenario
# excludes platform shell tools; its header owns the remaining schema set.

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  disabled: true

- id: plugin-package-inventory-deepseek
  disabled: true

- id: session-title-llm
  disabled: true

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: true

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: true

- id: session-persistence-jsonl
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: none

- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro

- insert:
    - id: claude-request-recording-probe
      name: ../../../fork-plugins/dsh-plugin-subscriptions/test/fixtures/claude-request-recording-probe.mjs
      inject: ['llm', 'sessionPersistence']
      config:
        providers: [claude]
        models:
          claude:
            - id: claude-opus-4-5
        pool:
          enabled: false
