# The recording composition: the headless profile already mounts the Host's recording
# service and the shipped JSONL persistence, so this patch adds only the plugin under test.
# The assembly calls the real plugin module's own `apply` and states the internals a
# deterministic test must replace — the Messages transport, the exact managed-settings answer,
# the policy_limits read and the unused organization transport — because the Loader supplies
# none. Claude only with an explicit catalog, so the composition registers no subscription
# tool and assembles no model-discovery request. This recording-only scenario excludes
# platform shell tools; its header owns the remaining schema set.

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: true

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: true

# This case issues no shell, file or skill work: the platform-specific skills a host happens
# to install must not reach the system prompt or the runtime context, so the snapshot reads the
# same on every lane.
- id: skill
  name: '@deepseek-ai/dsh-skill'
  disabled: true

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  disabled: true

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'
  disabled: true

- insert:
    - id: claude-policy-unknown-keys-probe
      name: ../../../fork-plugins/dsh-plugin-subscriptions/test/fixtures/claude-policy-unknown-keys-probe.mjs
      inject: ['llm', 'sessionPersistence']
      config:
        providers: [claude]
        models:
          claude:
            - id: claude-opus-4-5
        pool:
          enabled: false
