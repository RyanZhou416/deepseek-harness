# Composition owner for the AetherShell lifecycle scenario. The scenario is
# authored, so this live twin is never recorded; it exists so the composition has
# exactly one owner and so the replay patch's plugin wiring has a reviewable
# counterpart. The plugin reaches a persistent interpreter through
# `agent interactive` and a background program through `--deterministic -c`, so
# the fixture stands in for the installed binary on hosts without AetherShell.
- insert:
    - id: aether-shell
      name: '../../../fork-plugins/dsh-plugin-aether-shell/src/index.ts'
      config:
        executable: !!js process.execPath
        executableArgs:
          # The fixture sits beside the selected Session fixture, so the sibling
          # path is derived from the harness's own absolute fixture path.
          - !!js 'process.env.DSH_SNAPSHOT_FILE.replace(/[^\\/]+$/, "aether-lifecycle-fixture.mjs")'
          # Trusted control root: the run's isolated DSH home plus the directory
          # the observing jobs provider publishes wait registrations into.
          - !!js 'process.env.DSH_HOME + "/aether-fixture-wait"'
        # This recording predates foreground-to-job promotion. Keeping it off is
        # the compatibility opt-out that lets the committed session stay exactly
        # as recorded, without query job lifecycle events it never contained.
        promoteOnTimeout: false

    - id: jobs-wait-observer
      name: './jobs-wait-observer.mjs'
      config:
        terminalJobRetentionMs: 3600000
        maxRetainedTerminalJobsPerOwner: 100

# The shipped local provider is disabled in favor of the observing subclass
# above: the subclass registers the same `jobs` service and keeps every registry
# semantic, so only one provider is ever present.
- id: jobs
  disabled: true

# The recorded scenario exercises the native AetherShell lifecycle tools only.
# Both shipped shell tools are disabled so the pinned header and prompt do not
# depend on the host's shell dialect (tool-pwsh on Windows, tool-bash elsewhere).
- id: tool-bash
  disabled: true

- id: tool-pwsh
  disabled: true
